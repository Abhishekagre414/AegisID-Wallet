services:
  aegis-id-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_did_wallet
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_URL=${APP_URL:?set APP_URL to the public https URL (http://localhost:5000 for a local trial)}
      # Set these in your shell or a .env file next to this compose file:
      - ISSUER_API_KEY=${ISSUER_API_KEY:?set ISSUER_API_KEY (>= 24 chars)}
      - ISSUER_API_KEYS=${ISSUER_API_KEYS:-}
      - ISSUER_MASTER_SECRET=${ISSUER_MASTER_SECRET:?set ISSUER_MASTER_SECRET (>= 32 chars)}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - aegis_data:/app/backend/data

volumes:
  aegis_data:
    driver: local
